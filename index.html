<title>플레이어블 해부도</title>
<style>
:root { --bg:#E9EFF1; --panel:#F7FAFB; --ink:#132229; --ink-2:#44585F; --rule:#1322291F; --accent:#2A67BE; }
@media (prefers-color-scheme: dark) { :root { --bg:#0E1619; --panel:#162126; --ink:#E3EBEE; --ink-2:#A1B3B9; --rule:#E3EBEE21; --accent:#72A6F2; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; line-height:1.6; }
main { max-width:760px; margin:0 auto; padding:48px 20px 72px; display:flex; flex-direction:column; gap:20px; }
h1 { margin:0; font-size:32px; }
p { margin:0; color:var(--ink-2); }
ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
a.card { display:flex; flex-direction:column; gap:2px; padding:14px 16px; background:var(--panel); border:1px solid var(--rule); border-left:4px solid var(--accent); color:inherit; text-decoration:none; }
a.card:hover, a.card:focus-visible { border-color:var(--accent); outline:none; }
a.card b { font-size:17px; }
a.card span { font-size:13px; color:var(--ink-2); }
</style>
</head>

  </ul>

</html>
